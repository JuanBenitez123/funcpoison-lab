# Base stack — VULNERABLE configuration.
# The fix is an overlay: docker compose -f docker-compose.yml -f docker-compose.patched.yml up
services:
  orchestrator:
    build: ./orchestrator
    ports:
      - "3000:3000"
    environment:
      - ANALYZER_URL=http://analyzer:3001
      - PORT=3000
      - TEMPLATE_BIAS=0.3
      - REGISTRY_PATH=/app/registry/registry.json
    volumes:
      - ./registry/registry.json:/app/registry/registry.json:ro
      - ./orchestrator/src:/app/src:ro
    depends_on:
      analyzer:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 8s

  analyzer:
    build: ./analyzer
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    volumes:
      - ./analyzer/src:/app/src:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 8s
