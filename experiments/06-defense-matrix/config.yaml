# Defense matrix experiment
experiment_id: "06-defense-matrix"
task: "plan a safe route to the destination"

matrix:
  - { registry_state: "trusted",     output_validation: "off", expected: "normal" }
  - { registry_state: "trusted",     output_validation: "on",  expected: "normal" }
  - { registry_state: "compromised", output_validation: "off", expected: "attack_succeeds" }
  - { registry_state: "compromised", output_validation: "on",  expected: "attack_contained" }

record_fields:
  - tool_selected
  - tool_output_modified
  - downstream_accepted
  - downstream_action
  - attack_success

output:
  csv: "../../results/csv/defense_matrix.csv"
  table_md: "../../results/tables/defense_matrix.md"
  figure_png: "../../results/figures/defense_matrix.png"
